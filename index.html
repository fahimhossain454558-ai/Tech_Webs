<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06130e">
<meta name="description" content="Explore Tech Web's public projects: trade licence tools, Nagad projects, community sites and luxury CV designs.">
<title>Tech Web | My Projects</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23851529'/%3E%3Ccircle cx='50' cy='50' r='33' fill='%23741130' stroke='%239a1c32' stroke-width='3'/%3E%3Ctext x='50' y='62' text-anchor='middle' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23d9a0aa'%3ETW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06130e;--panel:#0b1d15;--panel2:#11291d;--ink:#f3ecdc;--muted:#9db0a4;--gold:#d9b970;--gold2:#f2dda6;--line:#d9b97033;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{min-width:320px;margin:0;color:var(--ink);font-family:var(--sans);line-height:1.55;background:radial-gradient(60rem 30rem at 85% -8%,#1f6b4a40,transparent 70%),radial-gradient(40rem 22rem at -5% 25%,#d9b9701a,transparent 70%),var(--bg)}
.wrap{width:min(1160px,calc(100% - 40px));margin:auto}
header{padding:22px 0}
.brand{display:inline-flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font:700 23px var(--serif);letter-spacing:.03em}
.mark{display:block;width:60px;height:60px;flex:none}
.mark svg{display:block;width:100%;height:100%}
.brand .name{display:flex;flex-direction:column;line-height:1}
.brand .name small{margin-top:5px;color:var(--gold);font:600 9px var(--sans);letter-spacing:.38em;text-transform:uppercase}
.hero{padding:clamp(30px,6vw,68px) 0 34px;text-align:center}
h1{margin:0;font:600 clamp(48px,10vw,100px)/1 var(--serif);letter-spacing:-.01em}
.lede{max-width:500px;margin:20px auto 0;color:var(--muted);font-size:17px}
.rule{width:96px;height:1px;margin:28px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;color:#1a1407;background:linear-gradient(100deg,#c49a4a,#f2dda6);font-size:12px;font-weight:700}
.btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:11px 24px;border:1px solid var(--gold);border-radius:999px;color:var(--gold2);font:600 14px var(--sans);text-decoration:none;cursor:pointer;background:transparent;transition:background .2s,box-shadow .2s}
.btn:hover{background:#d9b9701f}
.btn.gold{color:#1a1407;border-color:transparent;background:linear-gradient(100deg,#c49a4a,#f2dda6 55%,#d2ae62)}
.btn.gold:hover,.card:hover .btn.gold{box-shadow:0 8px 30px #d9b97048}
.bar{position:sticky;top:0;z-index:5;padding:14px 0;background:#06130eeb;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-direction:column;gap:12px}
.search{position:relative;display:block}
.search input{width:100%;min-height:54px;padding:12px 56px 12px 50px;border:1px solid var(--line);border-radius:14px;color:var(--ink);background:var(--panel);font:500 16px var(--sans)}
.search input::placeholder{color:#6f8478}
.search svg{position:absolute;left:18px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--gold)}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);padding:2px 9px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:12px var(--sans)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:8px 17px;border:1px solid var(--line);border-radius:999px;color:#d6ddd3;background:transparent;font:600 13px var(--sans);cursor:pointer;transition:border-color .2s}
.chip:hover{border-color:var(--gold)}
.chip b{margin-left:7px;color:var(--gold);font-weight:600}
.chip[aria-pressed=true]{color:#1a1407;border-color:transparent;background:linear-gradient(100deg,#c49a4a,#f2dda6)}
.chip[aria-pressed=true] b{color:#1a1407}
.meta{margin:22px 0 16px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-bottom:72px}
.card{--a:var(--gold);position:relative;display:flex;min-width:0;color:inherit;text-decoration:none;flex-direction:column;padding:12px 12px 22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));transition:border-color .2s}
.card:hover{border-color:#d9b970a6}
.thumb{display:grid;aspect-ratio:16/9;place-items:center;border:1px solid var(--line);border-radius:10px;color:var(--a);background:radial-gradient(circle at 75% 15%,#ffffff14,transparent 60%),linear-gradient(135deg,#183a29,#0a1b13)}
.thumb svg{width:62%;height:auto;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.thumb .f{fill:currentColor;stroke:none}
.thumb .d{opacity:.5}
.thumb .bg{fill:#0d2419}
.thumb text{fill:currentColor;stroke:none;font:700 14px var(--serif)}
.body{display:flex;flex:1;flex-direction:column;padding:16px 10px 0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat{color:var(--a);font-size:13px;font-weight:600}
.top .badge{padding:2px 10px;font-size:11px}
.card h3{margin:0;font:600 27px/1.12 var(--serif);overflow-wrap:anywhere}
.card p{margin:10px 0 22px;color:var(--muted);font-size:14px}
.card .btn{min-height:42px;margin-top:auto;align-self:flex-start;padding:9px 20px;font-size:13px}
.empty{grid-column:1/-1;padding:56px 20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.empty .btn{margin-top:16px}
footer{padding:26px 0 34px;border-top:1px solid var(--line);color:#7c9084;font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.wrap{width:calc(100% - 28px)}.grid{grid-template-columns:1fr;gap:13px}.search kbd{display:none}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="#top" aria-label="Tech Web, back to top"><span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100">
  <defs>
    <radialGradient id="wg" cx="36%" cy="28%" r="82%"><stop offset="0" stop-color="#9e2036"/><stop offset=".5" stop-color="#6a0f22"/><stop offset="1" stop-color="#3a0511"/></radialGradient>
    <radialGradient id="pg" cx="42%" cy="34%" r="76%"><stop offset="0" stop-color="#7d1629"/><stop offset=".6" stop-color="#5c0d1f"/><stop offset="1" stop-color="#43071a"/></radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4eeee"/><stop offset=".55" stop-color="#cfc3c5"/><stop offset="1" stop-color="#9d8f93"/></linearGradient>
    <filter id="wax" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4" result="bl"/>
      <feSpecularLighting in="bl" surfaceScale="3" specularConstant=".9" specularExponent="18" lighting-color="#ffd2d2" result="sp"><fePointLight x="28" y="12" z="45"/></feSpecularLighting>
      <feComposite in="sp" in2="d" operator="in" result="si"/>
      <feComposite in="d" in2="si" operator="arithmetic" k1="0" k2="1" k3=".8" k4="0"/>
    </filter>
    <filter id="emb" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".7" result="b"/>
      <feSpecularLighting in="b" surfaceScale="2.5" specularConstant="1" specularExponent="14" lighting-color="#ffc8c8" result="s"><fePointLight x="30" y="14" z="30"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0"/>
    </filter>
    <filter id="sh" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <ellipse cx="53" cy="90" rx="36" ry="5" fill="#000" opacity=".4" filter="url(#sh)"/>

  <g filter="url(#wax)">
    <g fill="url(#wg)">
      <circle cx="50" cy="48" r="39"/>
      <circle cx="20" cy="70" r="9"/>
      <circle cx="82" cy="28" r="8"/>
      <circle cx="75" cy="80" r="8"/>
      <circle cx="23" cy="24" r="6"/>
      <circle cx="50" cy="86" r="6"/>
    </g>
  </g>

  <g filter="url(#emb)">
    <circle cx="50" cy="48" r="31" fill="url(#pg)"/>
    <circle cx="50" cy="48" r="33" fill="none" stroke="#9a1c32" stroke-width="2.4"/>
    <circle cx="50" cy="48" r="27.5" fill="none" stroke="#8a1a2f" stroke-width=".9" stroke-dasharray=".1 2.6" stroke-linecap="round"/>
    <text x="51.2" y="59.3" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,'Times New Roman',serif" font-size="31" font-weight="700" fill="#2a0309" opacity=".85" letter-spacing="-.5">TW</text>
    <text x="50" y="58" text-anchor="middle" font-family="'Cormorant Garamond',Georgia,'Times New Roman',serif" font-size="31" font-weight="700" fill="url(#tg)" letter-spacing="-.5">TW</text>
    <path d="M38 66h24" stroke="#9a1c32" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg></span><span class="name">Tech Web<small>Luxury Studio</small></span></a></div></header>

<main>
  <section class="hero wrap" id="top">
    <h1>My Projects</h1>
    <p class="lede">Tap any project to open it. Search or pick a category to find what you need in seconds.</p>
    <div class="rule"></div>
  </section>

  <section aria-label="Browse projects">
    <div class="bar"><div class="wrap">
      <label class="search"><span class="sr">Search projects</span>
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search projects…" autocomplete="off"><kbd aria-hidden="true">/</kbd>
      </label>
      <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    </div></div>
    <div class="wrap">
      <p class="meta" id="meta" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
    </div>
  </section>
</main>

<footer><div class="wrap"><span>Made by Tech Web, <span id="year"></span></span><span>Tap any card to open the project.</span></div></footer>

<script>
const U="https://fahimhossain454558-ai.github.io/";
const K={Creative:"#f3ecdc",Nagad:"#f4a460",Community:"#8fd6a8","Trade licence":"#d9b970"};

// Thumbnails: simple line icons that show what each project is
const I={
qr:'<rect x="30" y="10" width="60" height="60" rx="5"/><path d="M38 18h16v16H38zM66 18h16v16H66zM38 46h16v16H38z"/><path class="f" d="M42 22h8v8h-8zM70 22h8v8h-8zM42 50h8v8h-8zM66 46h6v6h-6zM76 50h6v6h-6zM66 58h6v6h-6zM76 62h6v4h-6z"/>',
school:'<path d="M12 34 60 14l48 20zM22 34v38M98 34v38M8 72h104M52 72V52h16v20M30 44h12v10H30zM78 44h12v10H78zM60 14V3"/><path class="f" d="M60 3h11l-3.5 3.5L71 10H60z"/>',
alumni:'<circle class="d" cx="26" cy="40" r="6.5"/><path class="d" d="M13 62c0-8 6-13 13-13M107 62c0-8-6-13-13-13"/><circle class="d" cx="94" cy="40" r="6.5"/><circle cx="60" cy="34" r="8"/><path d="M42 62c0-11 8-17 18-17s18 6 18 17M44 20l16-8 16 8-16 8zM76 20v7"/><text x="60" y="76" text-anchor="middle">2026</text>',
paper:'<path d="M34 4h36l16 16v56H34zM70 4v16h16M42 32h36M42 42h36M42 52h20"/><circle class="bg" cx="84" cy="60" r="13"/><path d="M77 60l5 5 9-10"/>',
cv:'<path d="M34 4h52v72H34z"/><circle cx="48" cy="20" r="6"/><path d="M60 16h18M60 24h12M42 38h10M42 46h10M42 54h10M58 38h20M58 46h20M58 54h20M42 66h36"/><path class="f" d="M100 8l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>',
licence:'<path d="M34 4h52v72H34zM44 14h32M44 23h32M44 30h22"/><circle cx="60" cy="52" r="10"/><circle class="f" cx="60" cy="52" r="3.5"/><path d="M54 61l-3 13 9-5 9 5-3-13"/>'
};
I.cv2=I.cv+'<rect class="bg" x="76" y="52" width="32" height="20" rx="10"/><text x="92" y="66.5" text-anchor="middle">V2</text>';

// [repo, category, title, what it does, icon, isNew]  (newest first)
const L=[
["LUXURY-CV-V2","Creative","Luxury CV V2","Second edition of the luxury CV and résumé.","cv2",1],
["BANGLADESH-TRADE-LICENCE-08-11-2026-V2-15-11-2026-","Trade licence","Trade Licence 15 Nov 2026","Bangladesh trade licence, version dated 15 Nov 2026.","licence"],
["Luxury-Cv","Creative","Luxury CV","A luxury-style CV and résumé.","cv"],
["Nagad-Uddokta-Paper-Ready-V2","Nagad","Nagad Uddokta Paper Ready V2","Print-ready paper for Nagad Uddokta, version 2.","paper"],
["Alumni-Reunion-2026","Community","Alumni Reunion 2026","Alumni reunion page for 2026.","alumni"],
["Muradpur-Adarsha-High-School-Punormilon","Community","Muradpur Adarsha High School Reunion","Reunion (Punormilon) page for Muradpur Adarsha High School.","school"],
["Nagad-Custom-QR-Code","Nagad","Nagad Custom QR Code","Custom-designed QR code for Nagad.","qr"]
].map(([n,c,t,d,i,w])=>({n,c,t,d,i,w}));

const $=s=>document.querySelector(s),grid=$("#grid"),q=$("#q"),chips=$("#chips"),meta=$("#meta");
const cats=["All",...new Set(L.map(p=>p.c))];
let cur="All";
const ext='target="_blank" rel="noopener noreferrer"';

chips.innerHTML=cats.map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="${c===cur}">${c}<b>${c==="All"?L.length:L.filter(p=>p.c===c).length}</b></button>`).join("");

function setCat(c){
  cur=c;
  chips.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===c));
  render();
}

function render(){
  const s=q.value.trim().toLowerCase();
  const v=L.filter(p=>(cur==="All"||p.c===cur)&&`${p.n} ${p.c} ${p.t} ${p.d}`.toLowerCase().includes(s));
  grid.innerHTML=v.length?v.map(p=>`<a class="card" href="${U+p.n}/" ${ext} style="--a:${K[p.c]}">
      <div class="thumb"><svg viewBox="0 0 120 80" aria-hidden="true">${I[p.i]}</svg></div>
      <div class="body">
        <div class="top"><span class="cat">${p.c}</span>${p.w?'<span class="badge">New</span>':""}</div>
        <h3>${p.t}</h3>
        <p>${p.d}</p>
        <span class="btn gold">Open live site</span>
      </div>
    </a>`).join("")
    :'<div class="empty"><p>No projects found. Try a different word or category.</p><button class="btn gold" type="button" id="reset">Show all projects</button></div>';
  meta.textContent=`${v.length} ${v.length===1?"project":"projects"}${cur==="All"?"":" in "+cur}`;
}

chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)setCat(b.dataset.c)});
grid.addEventListener("click",e=>{if(e.target.id==="reset"){q.value="";setCat("All")}});
q.addEventListener("input",render);
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});
$("#year").textContent=new Date().getFullYear();
render();
</script>
</body>
</html>
